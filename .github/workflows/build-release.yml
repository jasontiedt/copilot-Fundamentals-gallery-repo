name: Build and Release

# Builds the app and publishes a GitHub Release. The version is provided either
# by the pushed tag (e.g. v1.2.3) or by the workflow_dispatch input, defaulting
# to the example version 1.0.0. That version is stamped into the build, the
# uploaded artifact, and the release itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, without the leading v)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Fall back to the example version if none was supplied.
          VERSION="${VERSION:-1.0.0}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript unit tests
        run: npm run test:ci

      - name: Build application
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.version }}
        run: npm run build

      - name: Package build artifact
        run: |
          tar -czf gallery-repo-${{ steps.version.outputs.version }}.tar.gz \
            .next public package.json package-lock.json next.config.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-repo-${{ steps.version.outputs.version }}
          path: gallery-repo-${{ steps.version.outputs.version }}.tar.gz
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: gallery-repo-${{ needs.build.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: gallery-repo-${{ needs.build.outputs.version }}.tar.gz
